[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-recombination-promotion-transfer"
version = "0.1.0"
description = "transfer scaffold for the SBT Neural Recombination Promotion experiment"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
